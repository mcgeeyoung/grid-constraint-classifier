layer_index: 0  # substation_capacity (234 records)
page_size: 2000
out_sr: 4326
capacity_unit: mw

url_discovery_method: static

# Fields: Location_Code, Station_Name, Bus_Name, Bus_Number,
#          Max_Injection, Percentage, Contingency, Exceedance_Location
field_map:
  Location_Code: feeder_id_external
  Station_Name: substation_name
  Bus_Name: feeder_name
  Max_Injection: hosting_capacity_mw
  Contingency: constraining_metric
