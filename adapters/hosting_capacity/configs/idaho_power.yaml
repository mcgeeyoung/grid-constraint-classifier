utility_code: idaho_power
utility_name: "Idaho Power"
parent_company: "IDACORP"
iso_id: null
states: [ID, OR]
data_source_type: arcgis_feature
requires_auth: false

# Generator Interconnection POI Heatmap (ArcGIS Experience Builder)
# https://experience.arcgis.com/experience/3390e1921c7e4682854f2b8781529426
# Layer 0: substation_capacity (234 point records) - Max_Injection per substation
