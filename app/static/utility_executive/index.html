<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Title + context chip are rewritten at runtime from /ui-config. -->
    <title>DER program · WattCarbon</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Source+Serif+Pro:wght@400;600;700&display=swap" />
    <link rel="stylesheet" href="/static/wc-brand.css" />
    <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" />
    <link rel="stylesheet" href="styles.css" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
    <script src="https://unpkg.com/vue@3.4.27/dist/vue.global.prod.js"></script>
  </head>
  <body>
    <div class="wc-brand-header">
      <img class="wc-logomark" src="/static/assets/logos/Symbol_on-dark.png" alt="WattCarbon" />
      <span class="wc-wordmark">WattCarbon</span>
      <span class="wc-sep">·</span>
      <span class="wc-context">DER program</span>
    </div>
    <main id="app">
      <div class="loading">Loading…</div>
    </main>
    <footer class="exec-footer">
      <span class="exec-footer-blurb">
        Live simulation grounded in recent DA market data. Slider scales to public utility targets.
      </span>
      <span class="exec-footer-links" data-footer-links>
        <!-- Populated at runtime for Dominion (/dominion-admin, /dominion-demo);
             other tenants currently have no sibling consoles. -->
      </span>
    </footer>
    <script type="module" src="app.js"></script>
  </body>
</html>
